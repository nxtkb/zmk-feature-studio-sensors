name: Validate sensor module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install -r tests/requirements.txt
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          ref: 4de313367288aad5aeaa1243890e40dc813f7008
          path: _deps/zmk
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk-studio-messages
          ref: 6cb4c283e76209d59c45fbcb218800cd19e9339d
          path: _deps/messages
      - uses: actions/checkout@v4
        with:
          repository: nanopb/nanopb
          ref: 7307ce399b81ddcb3c3a5dc862c52d4754328d38
          path: _deps/nanopb
      - name: Verify integration patches and canonical schema
        run: python scripts/check_patches.py --zmk _deps/zmk --messages _deps/messages
      - name: Check west-module storage compatibility and incremental builds
        run: python scripts/test_storage_signature.py
      - name: Prepare pinned Studio TX compatibility patch
        working-directory: _deps/zmk
        run: git apply ../../zephyr/patches/zmk/studio-rpc-tx-backpressure.patch
      - name: Check actual Studio TX/RX functions and pinned negative controls
        run: python scripts/test_studio_tx.py --zmk _deps/zmk
      - name: Prepare local message integration
        working-directory: _deps/messages
        run: git apply ../../zephyr/patches/zmk-studio-messages/studio-sensors-local.patch
      - name: Build the production C engine and Nanopb codec
        run: python scripts/build_host.py --nanopb _deps/nanopb --messages _deps/messages/proto/zmk
      - name: Test runtime and persistence failure handling
        run: python scripts/test_runtime.py

  firmware:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - shield: corne_left
            snippets: -S studio-rpc-usb-uart -S studio-sensors-local
          - shield: corne_right
            snippets: ""
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/zmk-feature-studio-sensors
          persist-credentials: false
      - name: Initialize pinned workspace
        working-directory: workspace
        run: |
          mkdir config
          cp zmk-feature-studio-sensors/tests/firmware/* config/
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west patch -sm zmk-feature-studio-sensors apply
          west zephyr-export
      - name: Build zero-sensor central or split peripheral
        working-directory: workspace
        run: >-
          west build -s zmk/app -d build -b nice_nano//zmk ${{ matrix.snippets }} --
          -DSHIELD=${{ matrix.shield }}
          -DZMK_CONFIG=${GITHUB_WORKSPACE}/workspace/config
          -DZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}/workspace/zmk-feature-studio-sensors
